name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate catalog
        run: python3 tools/catalog.py validate
      - name: Validate model manifest
        run: python3 tools/models.py validate
      - name: Check MODELS.md is up to date
        run: python3 tools/models.py md --check
      - name: Run tests
        run: pytest -q

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSCAD
        run: sudo apt-get update && sudo apt-get install -y openscad xvfb
      - name: Render the reference tray
        run: |
          export OPENSCADPATH=$PWD/scad/lib
          mkdir -p out
          openscad --export-format=binstl -o out/fit_3x2x3.stl scad/examples/fit_test_3x2x3.scad
          # offscreen PNG needs a virtual X server on CI runners (no GPU)
          xvfb-run -a openscad -o out/fit_3x2x3.png --camera=0,0,0,55,0,25,0 --viewall \
            --autocenter --imgsize=1000,700 scad/examples/fit_test_3x2x3.scad
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: generated-models
          path: out/
