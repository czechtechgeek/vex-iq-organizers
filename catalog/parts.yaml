# Katalog VEX IQ dílů — rozměry v mm.
#
# Pravidla:
#   pit = 12.7 mm (0.5"), tloušťka nosníku/desky = 6.35 mm (0.25")
#   délka nosníku/desky  = pocet_der * 12.7
#   šířka 1x = 12.7 mm, 2x = 25.4 mm (2 piny)
#   "rozmer" je bounding box v orientaci, v jaké díl leží v kapse (l = delší strana)
#   "stav":  odvozeno  = spočteno z pitchů (lze ověřit šuplerou)
#            k_mereni  = nutno změřit, rozměr je odhad nebo null
#            zmereno   = ověřeno šuplerou (doplní se datem)
#
# Po měření se doplní: presne: {l: .., w: .., h: ..} a stav: zmereno

