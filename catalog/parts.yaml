# VEX IQ parts catalog — all dimensions in mm.
#
# Rules:
#   pitch = 12.7 mm (0.5"), beam/plate thickness = 6.35 mm (0.25")
#   beam/plate length = holes * 12.7
#   1x width = 12.7 mm, 2x width = 25.4 mm
#   "size" is the bounding box in the orientation the part sits in a pocket (l = longer side)
#   "status":
#       derived       = computed from pitch (verify with calipers)
#       needs_measure = must be measured, the value is an estimate or null
#       measured      = verified with calipers
#       spec          = fixed by a standard (e.g. the Gridfinity grid)
#   "suggested_pocket": channel | nest | grid

