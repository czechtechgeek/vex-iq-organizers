# Manifest of built models (trays, inserts, accessories).
# Source of truth for MODELS.md — that file is generated by tools/models.py, never edit it by hand.
#
# status: draft    = geometry exists, not verified
#         verified = rendered, watertight, dimensions checked against the grid spec
#         printed  = physically printed and the fit was confirmed
#
# "prints" counts how many copies have been printed (for the school batches).

- id: fit-test-3x2x3
  name: "Fit test tray 3x2x3U"
  scad: scad/examples/fit_test_3x2x3.scad
  kind: gridfinity_tray
  cells: {x: 3, y: 2}
  height_u: 3
  size_mm: {x: 125.5, y: 83.5, z: 21.0}
  weight_g: 52
  pockets:
    - {type: divider, count: 1, parts: [beam-1x8]}
  parts_covered:
    beam-1x8: 2
  status: verified
  prints: 0
  preview: docs/img/fit_test_3x2x3.png
  note: "Reference tray and Gridfinity fit test. One divider makes two channels for 1x8 beams, with engraved labels. Print this first to confirm the 42 mm grid on your printer."

